name: Java CI/CD with SCA

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.6-eclipse-temurin-21
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Maven
      run: |
        if [ -f "mvnw" ]; then
          chmod +x mvnw
        fi
        
    - name: Build with Maven
      run: |
        if [ -f "mvnw" ]; then
          ./mvnw clean compile test package
        else
          mvn clean compile test package
        fi
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-app
        path: ./target/*.jar

  sca:
    runs-on: ubuntu-latest
    needs: [build]
    container:
      image: maven:3.9.6-eclipse-temurin-21
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run OWASP Dependency-Check SCA
      run: |
        echo "Running OWASP Dependency-Check SCA analysis..."
        mvn org.owasp:dependency-check-maven:check \
          -Dformat=HTML \
          -DsuppressionFiles=dependency-check-suppressions.xml
        
    - name: Upload SCA report artifact
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: target/dependency-check-report.html
