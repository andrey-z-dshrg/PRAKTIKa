name: Java CI/CD with SAST

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean compile -DskipTests

      - name: Run tests
        run: mvn test

      - name: Package application
        run: mvn package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/*.jar
          retention-days: 7

  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST scan
        id: semgrep
        run: |
          docker run --rm -v "$(pwd):/src" returntocorp/semgrep semgrep scan \
            --config auto \
            --sarif \
            --output=semgrep-results.sarif \
            --metrics=off

      - name: Analyze SAST results
        id: analyze
        run: |
          echo "🔍 Analyzing SAST results..."
          
          if [ ! -f "semgrep-results.sarif" ]; then
            echo "❌ SAST report not found"
            echo "TOTAL_ISSUES=0" >> $GITHUB_OUTPUT
            echo "CRITICAL_COUNT=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Count total issues
          TOTAL_ISSUES=$(jq '.runs[0].results | length' semgrep-results.sarif 2>/dev/null || echo "0")
          echo "Total issues: $TOTAL_ISSUES"
          echo "TOTAL_ISSUES=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
          
          # Count critical issues (error level)
          CRITICAL_COUNT=$(jq '[.runs[0].results[] | select(.level == "error")] | length' semgrep-results.sarif 2>/dev/null || echo "0")
          echo "Critical issues: $CRITICAL_COUNT"
          echo "CRITICAL_COUNT=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$TOTAL_ISSUES" -eq 0 ]; then
            echo "✅ No security issues found!"
            exit 0
          fi
          
          echo ""
          echo "📊 Security Issues Found:"
          echo "========================="
          
          # Show top 5 issues
          echo ""
          echo "Top 5 issues:"
          jq -r '.runs[0].results[:5][] | "- [" + (.level // "warning") + "] " + .ruleId + ": " + (.message.text | split("\n")[0])' semgrep-results.sarif 2>/dev/null
          
          echo ""
          echo "📈 Severity breakdown:"
          jq -r '.runs[0].results[].level // "warning"' semgrep-results.sarif 2>/dev/null | sort | uniq -c | sort -rn
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo ""
            echo "🚨 Found $CRITICAL_COUNT critical issues!"
          fi

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Create summary comment (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const total = parseInt('${{ steps.analyze.outputs.TOTAL_ISSUES }}') || 0;
            const critical = parseInt('${{ steps.analyze.outputs.CRITICAL_COUNT }}') || 0;
            
            if (total === 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 🔒 Security Scan Result\n✅ No security issues found!'
              });
              return;
            }
            
            const summary = `
            ## 🔒 Security Scan Result
            
            **Found ${total} security issue(s)** (${critical} critical)
            
            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${critical} |
            | 🟡 Warning | ${total - critical} |
            
            **Next steps:**
            1. Review findings in the "Security" tab
            2. Fix critical issues before merging
            3. View detailed report in workflow artifacts
            
            _Security scan completed successfully._
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail on critical issues
        if: steps.analyze.outputs.CRITICAL_COUNT > '0' && github.ref_name == 'main'
        run: |
          echo "🚨 Critical security issues detected! Failing pipeline for main branch."
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build, sast]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Deploy to server (example)
        run: |
          echo "Deploying application..."
          # Add your deployment commands here
          echo "✅ Deployment complete!"
