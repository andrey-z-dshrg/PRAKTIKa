name: Java CI/CD с SAST

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Сборка с Maven
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean compile -DskipTests
          else
            mvn clean compile -DskipTests
          fi

      - name: Запуск тестов
        run: |
          if [ -f "mvnw" ]; then
            ./mvnw test
          else
            mvn test
          fi

      - name: Создание пакета приложения
        run: |
          if [ -f "mvnw" ]; then
            ./mvnw package -DskipTests
          else
            mvn package -DskipTests
          fi

      - name: Загрузка JAR артефакта
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/*.jar
          retention-days: 7

  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Запуск SAST сканирования Semgrep
        id: semgrep
        run: |
          docker run --rm -v "$(pwd):/src" returntocorp/semgrep semgrep scan \
            --config auto \
            --sarif \
            --output=semgrep-results.sarif

      - name: Анализ результатов SAST
        id: analyze
        run: |
          echo "Анализ результатов SAST..."
          
          if [ ! -f "semgrep-results.sarif" ]; then
            echo "Отчет SAST не найден"
            echo "TOTAL_ISSUES=0" >> $GITHUB_OUTPUT
            echo "CRITICAL_COUNT=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          sudo apt-get update && sudo apt-get install -y jq
          
          TOTAL_ISSUES=$(jq '.runs[0].results | length' semgrep-results.sarif 2>/dev/null || echo "0")
          echo "Найдено проблем: $TOTAL_ISSUES"
          echo "TOTAL_ISSUES=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
          
          CRITICAL_COUNT=$(jq '[.runs[0].results[] | select(.level == "error")] | length' semgrep-results.sarif 2>/dev/null || echo "0")
          echo "Критических проблем: $CRITICAL_COUNT"
          echo "CRITICAL_COUNT=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$TOTAL_ISSUES" -eq 0 ]; then
            echo "Проблем безопасности не найдено!"
            exit 0
          fi
          
          echo ""
          echo "РАСПРЕДЕЛЕНИЕ ПО СЕРЬЕЗНОСТИ"
          echo "==========================="
          echo "| Серьезность | Количество |"
          echo "|-------------|------------|"
          echo "| Критические | $CRITICAL_COUNT |"
          echo "| Предупреждения | $((TOTAL_ISSUES - CRITICAL_COUNT)) |"
          echo "| Всего       | $TOTAL_ISSUES |"
          
          echo ""
          echo "ТОП-5 ПРОБЛЕМ БЕЗОПАСНОСТИ"
          echo "=========================="
          
          # Извлечение топ-5 проблем
          jq -r '.runs[0].results[:5][] | 
            "[" + (.level // "warning") + "] " + .ruleId + 
            ": " + (.message.text | split("\n")[0])' \
            semgrep-results.sarif 2>/dev/null || echo "Нет проблем для отображения"

      - name: Загрузка SARIF в GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Создание комментария с результатами (только для внутренних PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const total = parseInt('${{ steps.analyze.outputs.TOTAL_ISSUES }}') || 0;
            const critical = parseInt('${{ steps.analyze.outputs.CRITICAL_COUNT }}') || 0;
            
            if (total === 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## Результат проверки безопасности\n✅ Проблем безопасности не найдено!'
              });
              return;
            }
            
            const summary = `
            ## Результат проверки безопасности
            
            **Найдено ${total} проблем безопасности** (${critical} критических)
            
            | Серьезность | Количество |
            |-------------|------------|
            | 🔴 Критические | ${critical} |
            | 🟡 Предупреждения | ${total - critical} |
            
            **Следующие шаги:**
            1. Просмотрите найденные проблемы во вкладке "Security"
            2. Исправьте критические проблемы перед слиянием
            
            _Проверка безопасности успешно завершена._
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Логирование результатов для внешних PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "⚠️ Невозможно оставить комментарий во внешнем PR из-за ограничений безопасности GitHub"
          echo "Всего найдено проблем: ${{ steps.analyze.outputs.TOTAL_ISSUES }}"
          echo "Критических проблем: ${{ steps.analyze.outputs.CRITICAL_COUNT }}"
          echo "Пожалуйста, проверьте вкладку 'Security' для детальных результатов"

      - name: Завершение с ошибкой при критических проблемах
        if: steps.analyze.outputs.CRITICAL_COUNT > '0' && github.ref_name == 'main'
        run: |
          echo "Обнаружены критические проблемы безопасности! Завершение пайплайна для ветки main."
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build, sast]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Загрузка артефакта
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Отображение информации о деплое
        run: |
          echo "Деплой Java 21 приложения"
          echo "Сборка успешно завершена!"
          find . -name "*.jar" -type f | head -5
          echo "Готово к деплою"
