name: Security Scan with SAST Analysis

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Полная история для анализа
    
    - name: Set up Java
      if: contains(github.event_name, 'pull_request') || contains(github.event_name, 'push')
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven (optional)
      if: contains(github.event_name, 'pull_request') || contains(github.event_name, 'push')
      run: |
        echo "📦 Building project..."
        if [ -f "pom.xml" ]; then
          mvn clean compile -DskipTests
          echo "✅ Build successful"
        else
          echo "⚠️ No Maven project detected, skipping build"
        fi
    
    - name: Run Semgrep SAST Scan
      id: semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/java
          p/security-audit
          p/jwt
          p/sql-injection
          p/xss
          p/command-injection
        output: semgrep-results.sarif
        sarif: true
        publishToken: ${{ secrets.GITHUB_TOKEN }}
        publishDeployment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    
    - name: Analyze SAST Results
      id: analyze
      run: |
        echo "🔍 ANALYZING SAST RESULTS"
        echo "========================="
        
        # Проверяем наличие отчета
        if [ ! -f "semgrep-results.sarif" ]; then
          echo "❌ SAST report not found!"
          echo "TOTAL_ISSUES=0" >> $GITHUB_OUTPUT
          echo "CRITICAL_COUNT=0" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Устанавливаем jq если нет
        if ! command -v jq &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y jq
        fi
        
        # Читаем общее количество проблем
        TOTAL_ISSUES=$(jq '.runs[0].results | length' semgrep-results.sarif 2>/dev/null || echo "0")
        echo "📊 Total issues found: $TOTAL_ISSUES"
        echo "TOTAL_ISSUES=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
        
        if [ "$TOTAL_ISSUES" -eq 0 ]; then
          echo ""
          echo "🎉 SUCCESS: No security issues detected!"
          echo "CRITICAL_COUNT=0" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Подсчитываем критичные проблемы
        CRITICAL_COUNT=$(jq '[.runs[0].results[] | select(.level == "error")] | length' semgrep-results.sarif 2>/dev/null || echo "0")
        WARNING_COUNT=$(jq '[.runs[0].results[] | select(.level == "warning")] | length' semgrep-results.sarif 2>/dev/null || echo "0")
        INFO_COUNT=$(jq '[.runs[0].results[] | select(.level == "note" or .level == null)] | length' semgrep-results.sarif 2>/dev/null || echo "0")
        
        echo "CRITICAL_COUNT=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
        
        echo ""
        echo "📈 SEVERITY BREAKDOWN"
        echo "---------------------"
        echo "| SEVERITY  | COUNT |"
        echo "|-----------|-------|"
        echo "| 🔴 Critical | $CRITICAL_COUNT |"
        echo "| 🟡 Warning  | $WARNING_COUNT |"
        echo "| 🔵 Info     | $INFO_COUNT |"
        echo "| 📊 Total    | $TOTAL_ISSUES |"
        
        echo ""
        echo "🔧 TOP 10 ISSUES"
        echo "----------------"
        
        # Извлекаем топ 10 проблем
        jq -r '.runs[0].results[:10][] | 
          "## [" + (.level // "warning") + "] " + .ruleId + "\n" +
          "**Description:** " + .message.text + "\n" +
          "**Location:** `" + .locations[0].physicalLocation.artifactLocation.uri + ":" + 
          (.locations[0].physicalLocation.region.startLine // "?") + "`\n" +
          "**Rule:** " + .ruleId + "\n" +
          "---"' semgrep-results.sarif 2>/dev/null || echo "No issues to display"
        
        echo ""
        echo "📋 DETAILED ISSUES BY CATEGORY"
        echo "-------------------------------"
        
        # Группируем по категориям
        echo "```"
        jq -r '.runs[0].results[].ruleId' semgrep-results.sarif 2>/dev/null | \
          sort | uniq -c | sort -rn | head -20
        echo "```"
        
        # Создаем summary для PR
        echo "SUMMARY=Found $TOTAL_ISSUES security issues ($CRITICAL_COUNT critical, $WARNING_COUNT warnings)" >> $GITHUB_OUTPUT
        
        # Если есть критические проблемы, отмечаем как предупреждение
        if [ "$CRITICAL_COUNT" -gt 0 ]; then
          echo "🚨 CRITICAL ISSUES DETECTED: $CRITICAL_COUNT" >&2
          echo "ACTION_REQUIRED=true" >> $GITHUB_OUTPUT
        else
          echo "ACTION_REQUIRED=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Security Report
      if: steps.analyze.outputs.TOTAL_ISSUES != '0'
      run: |
        echo "📄 Creating detailed security report..."
        
        # Создаем Markdown отчет
        cat > SECURITY_REPORT.md << 'EOF'
# 🔒 Security Scan Report
        
**Scan Date:** $(date)
**Branch:** ${{ github.ref }}
**Commit:** ${{ github.sha }}
        
## Executive Summary
        
| Metric | Value |
|--------|-------|
| Total Issues | ${{ steps.analyze.outputs.TOTAL_ISSUES }} |
| Critical Issues | ${{ steps.analyze.outputs.CRITICAL_COUNT }} |
| Scan Status | $(if [ "${{ steps.analyze.outputs.CRITICAL_COUNT }}" -gt 0 ]; then echo "❌ Needs Attention"; else echo "✅ Passed"; fi) |
        
## Issues Breakdown
        
EOF
        
        # Добавляем детали по проблемам
        if [ -f "semgrep-results.sarif" ]; then
          echo "### Top Security Issues" >> SECURITY_REPORT.md
          echo "" >> SECURITY_REPORT.md
          echo "| Severity | Rule ID | Description | Location |" >> SECURITY_REPORT.md
          echo "|----------|---------|-------------|----------|" >> SECURITY_REPORT.md
          
          jq -r '.runs[0].results[:20][] | 
            "| " + (.level // "warning") + " | `" + .ruleId + "` | " + 
            (.message.text | gsub("\n"; " ")) + " | `" + 
            .locations[0].physicalLocation.artifactLocation.uri + ":" + 
            (.locations[0].physicalLocation.region.startLine // "?") + "` |"' \
            semgrep-results.sarif 2>/dev/null >> SECURITY_REPORT.md
        fi
        
        # Добавляем рекомендации
        cat >> SECURITY_REPORT.md << 'EOF'
        
## Recommendations
        
1. **Immediate Action Required:** Fix all critical issues (severity: error)
2. **High Priority:** Address warning-level issues within 2 weeks
3. **Best Practices:**
   - Review and fix issues in order of severity
   - Enable code review for security-sensitive changes
   - Schedule regular security scans
        
## Next Steps
        
EOF
        
        if [ "${{ steps.analyze.outputs.CRITICAL_COUNT }}" -gt 0 ]; then
          echo "- [ ] Fix critical security issues immediately" >> SECURITY_REPORT.md
        fi
        
        echo "- [ ] Review all security findings" >> SECURITY_REPORT.md
        echo "- [ ] Update dependencies if needed" >> SECURITY_REPORT.md
        
        echo "✅ Report generated: SECURITY_REPORT.md"
    
    - name: Upload Security Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: |
          semgrep-results.sarif
          SECURITY_REPORT.md
        retention-days: 7
    
    - name: Upload SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: semgrep-results.sarif
        category: semgrep
      if: always()
    
    - name: Post Security Summary to PR
      if: github.event_name == 'pull_request' && steps.analyze.outputs.TOTAL_ISSUES != '0'
      uses: actions/github-script@v7
      with:
        script: |
          const { TOTAL_ISSUES, CRITICAL_COUNT, SUMMARY } = process.env;
          const total = parseInt(TOTAL_ISSUES) || 0;
          const critical = parseInt(CRITICAL_COUNT) || 0;
          
          if (total === 0) {
            return;
          }
          
          const summary = `
          ## 🔒 Security Scan Results
          
          **${SUMMARY}**
          
          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | ${critical} |
          | 🟡 Warning | ${total - critical} |
          | 📊 Total | ${total} |
          
          **Next Steps:**
          1. Review the security findings in the "Security" tab
          2. Fix critical issues before merging
          3. Download the full report from artifacts
          
          View detailed report in [Security](https://github.com/${context.repo.owner}/${context.repo.repo}/security) tab.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
      env:
        TOTAL_ISSUES: ${{ steps.analyze.outputs.TOTAL_ISSUES }}
        CRITICAL_COUNT: ${{ steps.analyze.outputs.CRITICAL_COUNT }}
        SUMMARY: ${{ steps.analyze.outputs.SUMMARY }}
    
    - name: Fail on Critical Issues (Optional)
      if: steps.analyze.outputs.CRITICAL_COUNT > 0 && github.ref_name == 'main'
      run: |
        echo "🚨 Critical security issues detected. Failing pipeline..."
        echo "Please fix the issues before merging to main."
        exit 1

  notify:
    name: Notify Team
    needs: [sast]
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
    - name: Download Security Report
      uses: actions/download-artifact@v4
      with:
        name: security-report
        
    - name: Send Slack Notification (Optional)
      if: steps.sast.outputs.ACTION_REQUIRED == 'true'
      uses: slackapi/slack-github-action@v1.24.0
      with:
        channel-id: 'security-alerts'
        slack-message: |
          🔒 Security Scan Completed
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref }}
          Issues Found: ${{ needs.sast.outputs.TOTAL_ISSUES }}
          Critical Issues: ${{ needs.sast.outputs.CRITICAL_COUNT }}
          
          View Report: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
