name: Java CI/CD with SAST

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean compile -DskipTests
          else
            mvn clean compile -DskipTests
          fi

      - name: Run tests
        run: |
          if [ -f "mvnw" ]; then
            ./mvnw test
          else
            mvn test
          fi

      - name: Package application
        run: |
          if [ -f "mvnw" ]; then
            ./mvnw package -DskipTests
          else
            mvn package -DskipTests
          fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/*.jar
          retention-days: 7

  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST scan
        id: semgrep
        run: |
          docker run --rm -v "$(pwd):/src" returntocorp/semgrep semgrep scan \
            --config auto \
            --sarif \
            --output=semgrep-results.sarif

      - name: Analyze SAST results
        id: analyze
        run: |
          echo "Analyzing SAST results..."
          
          if [ ! -f "semgrep-results.sarif" ]; then
            echo "SAST report not found"
            echo "TOTAL_ISSUES=0" >> $GITHUB_OUTPUT
            echo "CRITICAL_COUNT=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          sudo apt-get update && sudo apt-get install -y jq
          
          TOTAL_ISSUES=$(jq '.runs[0].results | length' semgrep-results.sarif 2>/dev/null || echo "0")
          echo "Total issues found: $TOTAL_ISSUES"
          echo "TOTAL_ISSUES=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
          
          CRITICAL_COUNT=$(jq '[.runs[0].results[] | select(.level == "error")] | length' semgrep-results.sarif 2>/dev/null || echo "0")
          echo "Critical issues: $CRITICAL_COUNT"
          echo "CRITICAL_COUNT=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$TOTAL_ISSUES" -eq 0 ]; then
            echo "No security issues found!"
            exit 0
          fi
          
          echo ""
          echo "SEVERITY BREAKDOWN"
          echo "=================="
          echo "| Severity  | Count |"
          echo "|-----------|-------|"
          echo "| Critical  | $CRITICAL_COUNT |"
          echo "| Warning   | $((TOTAL_ISSUES - CRITICAL_COUNT)) |"
          echo "| Total     | $TOTAL_ISSUES |"
          
          echo ""
          echo "TOP 5 SECURITY ISSUES"
          echo "====================="
          
          # Extract top 5 issues
          jq -r '.runs[0].results[:5][] | 
            "[" + (.level // "warning") + "] " + .ruleId + 
            ": " + (.message.text | split("\n")[0])' \
            semgrep-results.sarif 2>/dev/null || echo "No issues to display"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Create summary comment (only for internal PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const total = parseInt('${{ steps.analyze.outputs.TOTAL_ISSUES }}') || 0;
            const critical = parseInt('${{ steps.analyze.outputs.CRITICAL_COUNT }}') || 0;
            
            if (total === 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## Security Scan Result\n✅ No security issues found!'
              });
              return;
            }
            
            const summary = `
            ## Security Scan Result
            
            **Found ${total} security issue(s)** (${critical} critical)
            
            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${critical} |
            | 🟡 Warning | ${total - critical} |
            
            **Next steps:**
            1. Review findings in the "Security" tab
            2. Fix critical issues before merging
            
            _Security scan completed successfully._
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Log results for fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "⚠️ Cannot comment on fork PRs due to GitHub security restrictions"
          echo "Total issues found: ${{ steps.analyze.outputs.TOTAL_ISSUES }}"
          echo "Critical issues: ${{ steps.analyze.outputs.CRITICAL_COUNT }}"
          echo "Please check the 'Security' tab for detailed results"

      - name: Fail on critical issues
        if: steps.analyze.outputs.CRITICAL_COUNT > '0' && github.ref_name == 'main'
        run: |
          echo "Critical security issues detected! Failing pipeline for main branch."
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build, sast]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Display deployment info
        run: |
          echo "Deploying Java 21 Application"
          echo "Build successful!"
          find . -name "*.jar" -type f | head -5
          echo "Ready for deployment"
