name: DAST Security Scan with OWASP ZAP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 and build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: mvn -B clean package -DskipTests

      - name: Start Application
        run: |
          JAR_PATH=$(find target -name "*.jar" -type f | head -1)
          echo "🟢 Starting: $JAR_PATH"
          nohup java -jar "$JAR_PATH" > application.log 2>&1 &
          echo $! > app.pid
          echo "PID: $(cat app.pid)"
          # Даем больше времени для Spring Boot
          echo "Waiting 50 seconds for app to start..."
          sleep 50
          # Проверяем доступность
          if curl --retry 3 --retry-delay 5 --retry-connrefused -s -o /dev/null http://localhost:8080; then
            echo "✅ Application is ready"
          else
            echo "⚠️  Application may be slow, continuing anyway..."
            cat application.log
          fi

      # ЗАМЕНИТЕ ВЕРСИИ НА АКТУАЛЬНЫЕ ЕСЛИ НУЖНО
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0 # ← ПРОВЕРЬТЕ ВЕРСИЮ
        with:
          target: 'http://localhost:8080'
          cmd_options: '-I'
          scan_timeout: '900' # 15 минут

      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0 # ← ПРОВЕРЬТЕ ВЕРСИЮ
        with:
          target: 'http://localhost:8080'
          cmd_options: '-I'
          scan_timeout: '900'

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-reports
          path: |
            zap_report.html
            zap_api_report.html
          retention-days: 7

      - name: Stop Application
        if: always()
        run: |
          if [ -f app.pid ]; then
            echo "Stopping app PID $(cat app.pid)"
            kill $(cat app.pid) 2>/dev/null || true
            rm -f app.pid app.log
          fi
