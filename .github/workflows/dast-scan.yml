name: DAST Security Scan with OWASP ZAP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# ВАЖНО: Расширенные права для GITHUB_TOKEN
permissions:
  contents: read
  actions: write      # Для управления workflow и артефактами
  security-events: write # Ключевое право для сканеров безопасности
  checks: write       # Для обновления статуса проверок
  id-token: write     # Для будущей аутентификации (опционально, но рекомендуется)

jobs:
  # JOB 1: Сборка приложения
  build:
    runs-on: ubuntu-latest
    outputs:
      jar-name: ${{ steps.find-jar.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 and build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: mvn -B clean package -DskipTests

      - name: Find JAR file
        id: find-jar
        run: |
          JAR_NAME=$(ls target/*.jar | head -1)
          echo "name=${JAR_NAME##*/}" >> $GITHUB_OUTPUT
          echo "path=$JAR_NAME" >> $GITHUB_OUTPUT

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ steps.find-jar.outputs.path }}

  # JOB 2: Запуск приложения и сканирование (зависит от сборки)
  scan:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Start Application
        run: |
          JAR_FILE=$(ls *.jar | head -1)
          echo "🟢 Запуск: $JAR_FILE"
          nohup java -jar "$JAR_FILE" > app.log 2>&1 &
          echo $! > app.pid
          echo "PID: $(cat app.pid)"
          echo "⏳ Ожидание 70 секунд..."
          sleep 70
          echo "🔍 Проверка здоровья..."
          curl --max-time 30 --retry 2 --retry-delay 10 -s -f http://localhost:8080/actuator/health || echo "Проверка не удалась, продолжаем..."

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        continue-on-error: true # Продолжать даже при ошибках ZAP
        with:
          target: 'http://localhost:8080'
          cmd_options: '-I -j' # -j для JSON отчета
          scan_timeout: '1200'
          rules_file_name: 'rules.tsv'

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        continue-on-error: true
        with:
          target: 'http://localhost:8080'
          cmd_options: '-I -j'
          scan_timeout: '1200'

      - name: List and Upload Reports
        if: always()
        run: |
          echo "📁 Содержимое директории:"
          ls -la
          echo "📄 Поиск отчетов ZAP:"
          find . -name "*.html" -o -name "*.json" -o -name "*.md" | head -10
        # Загружаем все возможные отчеты
      - name: Upload All Scan Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-reports
          path: |
            *.html
            *.json
            *.md
            app.log
          retention-days: 7

      - name: Stop Application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill -9 $(cat app.pid) 2>/dev/null || true
            echo "✅ Приложение остановлено"
          fi
