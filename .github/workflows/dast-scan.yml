name: DAST Security Scan with OWASP ZAP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # workflow_dispatch: # Раскомментируйте, чтобы запускать вручную из интерфейса

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Ограничим время выполнения

    steps:
      # Шаг 1: Получить код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: Установить Java и собрать приложение
      - name: Set up JDK 21 and build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: mvn -B clean package -DskipTests
        env:
          # Если нужно настроить Maven для ускорения
          MAVEN_OPTS: '-Dmaven.repo.local=${{ runner.temp }}/.m2/repository'

      # Шаг 3: Запустить приложение в фоновом режиме
      - name: Start Application
        run: |
          JAR_PATH=$(find target -name "*.jar" -type f | head -1)
          echo "Starting application: $JAR_PATH"
          # Запускаем в фоне, логи пишем в файл
          nohup java -jar "$JAR_PATH" > application.log 2>&1 &
          echo $! > app.pid
          echo "Application PID: $(cat app.pid)"
          # Даем время на старт
          sleep 30
          # Простая проверка, что приложение отвечает
          curl --retry 5 --retry-delay 5 --retry-connrefused -s -o /dev/null http://localhost:8080/actuator/health || echo "Health check may have failed, continuing..."

      # Шаг 4: Запустить базовое сканирование OWASP ZAP
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          # Если у вас есть файл с правилами, раскомментируйте строку ниже
          # rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I' # Игнорировать предупреждения для первого запуска
          # Увеличим таймаут для больших приложений
          scan_timeout: '600' # 10 минут в секундах

      # Шаг 5: Запустить сканирование API OWASP ZAP
      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.13.0
        with:
          target: 'http://localhost:8080'
          # Если у вашего приложения есть OpenAPI спецификация, укажите её:
          # format: 'openapi'
          # target: 'http://localhost:8080/v3/api-docs'
          cmd_options: '-I'
          scan_timeout: '600'

      # Шаг 6: Сохранить отчеты как артефакты (даже если сканирование упало)
      - name: Upload ZAP Reports
        if: always() # Выполнять всегда, даже при ошибке сканирования
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-reports
          path: |
            zap_report.html
            zap_api_report.html
          retention-days: 7

      # Шаг 7 (опционально): Остановить приложение после сканирования
      - name: Stop Application
        if: always()
        run: |
          if [ -f app.pid ]; then
            echo "Stopping application with PID $(cat app.pid)"
            kill $(cat app.pid) 2>/dev/null || true
            rm -f app.pid
          fi
