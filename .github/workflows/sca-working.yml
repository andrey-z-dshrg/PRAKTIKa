name: SCA Analysis Working

on:
  pull_request:
    branches: [ main ]

jobs:
  sca:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run OWASP Dependency-Check with Docker
      run: |
        echo "Running OWASP Dependency-Check using Docker..."
        
        # Создаем папку для отчетов
        mkdir -p ./reports
        
        # Запускаем Dependency-Check через Docker
        docker run --rm \
          -v "$(pwd)":/src \
          -v "$(pwd)/reports":/reports \
          owasp/dependency-check:9.0.9 \
          --scan /src \
          --format "HTML" \
          --format "JSON" \
          --out /reports \
          --project "PRAKTIKa" \
          --suppression /src/dependency-check-suppressions.xml \
          --failOnCVSS 0
        
        echo "SCA analysis completed!"
        ls -la ./reports/
        
    - name: Upload SCA reports
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: |
          reports/dependency-check-report.html
          reports/dependency-check-report.json
        retention-days: 7
